name: Preview Build
on:
  workflow_dispatch:
    inputs:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Detect NDK
        run: |
          NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          echo "Using NDK: $NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK=$NDK_PATH" >> $GITHUB_ENV

      - name: Native Build
        run: ./run lib core

      - name: Upload LibCore AAR
        uses: actions/upload-artifact@v4
        with:
          name: libcore-aar
          path: app/libs/libcore.aar

  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download LibCore AAR
        uses: actions/download-artifact@v4
        with:
          name: libcore-aar
          path: app/libs

      - name: Ensure Static Release Keystore
        run: |
          if [ ! -f app/fixed-release.jks ]; then
            echo "Generating persistent signing keystore..."
            keytool -genkeypair -v \
              -keystore app/fixed-release.jks \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias nekobox \
              -storepass nekobox123 \
              -keypass nekobox123 \
              -dname "CN=NekoBox,OU=Neko,O=Neko,L=Tokyo,C=JP"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/fixed-release.jks
            git commit -m "chore: persist static signing keystore for future in-place updates" || true
            git push origin main || true
          fi

      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          echo "ndk.dir=${NDK_PATH}" >> local.properties
          ./run init action gradle
          ./gradlew app:assemblePreviewRelease
          
          # Ensure all APKs are strictly 4-byte/page aligned and signed with the persistent keystore
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          KEYSTORE="app/fixed-release.jks"
          for apk in $(find app/build/outputs/apk -name '*.apk'); do
            echo "Processing alignment and signing for $apk..."
            aligned_apk="${apk/.apk/-aligned.apk}"
            $BUILD_TOOLS/zipalign -p -f 4 "$apk" "$aligned_apk"
            
            clean_apk="${apk/-unsigned/}"
            $BUILD_TOOLS/apksigner sign --ks "$KEYSTORE" \
              --ks-pass pass:nekobox123 \
              --ks-key-alias nekobox \
              --key-pass pass:nekobox123 \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$clean_apk" "$aligned_apk"
            
            rm -f "$aligned_apk"
            if [ "$clean_apk" != "$apk" ]; then
              rm -f "$apk"
            fi
            
            echo "Verifying $clean_apk:"
            $BUILD_TOOLS/zipalign -c 4 "$clean_apk"
            $BUILD_TOOLS/apksigner verify --verbose "$clean_apk"
          done

          APK=$(find app/build/outputs/apk -name '*.apk')
          APK_DIR=$(dirname $(echo "$APK" | head -n 1))
          echo "APK_DIR=$APK_DIR" >> $GITHUB_ENV

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: NekoBox-APKs
          path: ${{ env.APK_DIR }}/*.apk

      - name: Publish to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.4.3-preview ${{ env.APK_DIR }}/*.apk --clobber --repo illtree/NekoBoxForAndroid
