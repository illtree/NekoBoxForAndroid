name: Preview Build
on:
  workflow_dispatch:
    inputs:
  push:
    branches:
      - main
      - master

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Detect NDK
        run: |
          NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          echo "Using NDK: $NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK=$NDK_PATH" >> $GITHUB_ENV

      - name: Native Build
        run: ./run lib core

      - name: Upload LibCore AAR
        uses: actions/upload-artifact@v4
        with:
          name: libcore-aar
          path: app/libs/libcore.aar

  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download LibCore AAR
        uses: actions/download-artifact@v4
        with:
          name: libcore-aar
          path: app/libs

      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          echo "ndk.dir=${NDK_PATH}" >> local.properties
          ./run init action gradle
          ./gradlew app:assemblePreviewRelease
          
          # Ensure all APKs are properly signed
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkey -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          for apk in $(find app/build/outputs/apk -name '*unsigned*.apk'); do
            echo "Signing $apk..."
            signed_apk="${apk/-unsigned/}"
            $BUILD_TOOLS/apksigner sign --ks "$KEYSTORE" --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --out "$signed_apk" "$apk"
            rm "$apk"
          done

          APK=$(find app/build/outputs/apk -name '*.apk')
          APK_DIR=$(dirname $(echo "$APK" | head -n 1))
          echo "APK_DIR=$APK_DIR" >> $GITHUB_ENV

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: NekoBox-APKs
          path: ${{ env.APK_DIR }}/*.apk
